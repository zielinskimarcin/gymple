<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gymple Legal</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0e10;
        --card: #17191d;
        --text: #f7f7f8;
        --muted: #a6abb4;
        --accent: #ff6a3c;
        --border: #292d34;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 20px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 36px;
        line-height: 1.15;
      }
      p {
        color: var(--muted);
        margin: 0 0 28px;
      }
      nav {
        display: grid;
        gap: 12px;
      }
      a {
        display: block;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        color: var(--text);
        text-decoration: none;
        font-weight: 800;
      }
      a span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }
      a:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gymple Legal</h1>
      <p>Legal documents for the Gymple mobile app.</p>
      <nav aria-label="Legal documents">
        <a href="./privacy.html">
          Privacy Policy
          <span>How Gymple collects, uses, and protects data.</span>
        </a>
        <a href="./terms.html">
          Terms of Use
          <span>The rules for using Gymple and its Premium features.</span>
        </a>
        <a href="./support.html">
          Support
          <span>How to contact support and request help.</span>
        </a>
      </nav>
    </main>
  </body>
</html>
